# android/gradle.properties

# --- MEMORY (fix Metaspace OOMs) ---
# Heap for Gradle daemon + Kotlin compiler
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -Dkotlin.daemon.jvm.options=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# (Optional) quiet the daemon perf logs
org.gradle.daemon.performance.disable-logging=true

# --- ANDROIDX / EXPO / RN FLAGS ---
android.useAndroidX=true
android.enablePngCrunchInReleaseBuilds=true

# Limit ABIs during local builds to reduce memory (you can re-enable x86/x86_64 later if needed)
reactNativeArchitectures=armeabi-v7a,arm64-v8a

# New architecture (Turbo/Fabric)
newArchEnabled=false

# JS engine
hermesEnabled=true

# Expo image codecs
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# Dev client network inspector
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Packaging
expo.useLegacyPackaging=false

# Edge-to-edge
expo.edgeToEdgeEnabled=false

# SDK levels (keep in sync with your build)
android.minSdkVersion=24
android.compileSdkVersion=35
android.targetSdkVersion=35
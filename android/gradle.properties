# -----------------------------
# Gradle ve JVM bellek ayarları
# -----------------------------
# Daha stabil ve hızlı derleme için bellek arttırıldı.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dkotlin.daemon.jvm.options=-Xmx2048m

# Paralel derleme ve cache (build sürelerini kısaltır)
org.gradle.parallel=true
org.gradle.caching=true

# Uyarıları görünür tut (teşhis kolaylaşır)
org.gradle.warning.mode=all

# --------------------------------
# AndroidX ve paketleme ayarları
# --------------------------------
android.useAndroidX=true

# Release'te PNG crunch (görsel optimizasyonu)
android.enablePngCrunchInReleaseBuilds=true

# ------------------------------------------------
# React Native mimari/JS motoru ve yeni mimari
# ------------------------------------------------
# Debug'ta tüm mimarileri açık tut; release'te komutla kısıtlayabilirsin:
# ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Yeni Mimari (Fabric/Turbo) devre dışı (kütüphanelerin hazır olunca true yapabilirsin)
newArchEnabled=false

# Hermes açık (RN 0.79 için önerilen)
hermesEnabled=true

# ----------------------------
# Expo görüntü formatı bayrakları
# ----------------------------
# GIF ve WebP desteği (ihtiyaç yoksa kapatabilirsin)
expo.gif.enabled=true
expo.webp.enabled=true
# iOS destek kısıtı nedeniyle animasyonlu webp kapalı
expo.webp.animated=false

# ----------------------------
# Debug yardımcıları
# ----------------------------
# Expo Dev Client ağ izleyici
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Modern packaging (legacy=false)
expo.useLegacyPackaging=false

# ----------------------------
# Android API seviye eşleşmeleri
# (build.gradle ve app.json ile uyumlu)
# ----------------------------
android.minSdkVersion=24
android.compileSdkVersion=35
android.targetSdkVersion=35

# ----------------------------
# Kenardan-kenara UI (edge-to-edge)
# Tasarımın buna uygunsa true yap ve tema/renkleri güncelle
# ----------------------------
expo.edgeToEdgeEnabled=false
pluginManagement {
  repositories {
    gradlePluginPortal()
    google()
    mavenCentral()
  }

  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine(
        "node", "--print",
        "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"
      )
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)

  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine(
        "node", "--print",
        "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })"
      )
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)
}

plugins {
  id("com.facebook.react.settings")
  id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand)
  }
}
expoAutolinking.useExpoModules()

rootProject.name = "Talkee"

// --- RN AAR MAVEN DİZİNİ
def reactNativePackageJson = providers.exec {
  workingDir(rootDir)
  commandLine("node", "--print", "require.resolve('react-native/package.json')")
}.standardOutput.asText.get().trim()
def reactNativeAndroidDir = new File(reactNativePackageJson, "../android").getCanonicalFile()

// --- EXPO ANDROID MODÜLÜNÜ EKLE
include(":expo")
project(":expo").projectDir = new File(new File(rootDir, "../node_modules/expo"), "android")

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
  repositories {
    // RN'in AAR'larının bulunduğu repo (ZORUNLU)
    maven { url reactNativeAndroidDir }

    google()
    mavenCentral()
    maven { url = uri("https://www.jitpack.io") }
    // mavenLocal() // (opsiyonel) istersen aç
  }
}

include(":app")
includeBuild(expoAutolinking.reactNativeGradlePlugin)